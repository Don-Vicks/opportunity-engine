# Personal settings. Secrets (Telegram/Gmail) come from env vars, never from here.
profile:
  # Jobs/freelance must mention at least one of these (strict role filter)
  roleSkills: [nextjs, react, expo, express, nestjs, rust]
  # Used for ranking (and for matching hackathons/bounties/grants)
  skills: [nextjs, react, expo, express, nestjs, rust, typescript, node, solana, anchor, web3]
  preferredTypes: [job, freelance, hackathon, bounty, grant]
  remoteOnly: true               # drops anything that isn't remote (onsite/hybrid)
  regionFilter: true             # drops region-locked roles (US only, EU only, ...); keeps worldwide/Africa/WAT-friendly
  availableEffort: medium        # low | medium | high
  deadlineWindowDays: 45
  minPrizeUsd:
    hackathon: 1000
    bounty: 300
    freelance: 500
    grant: 200
    job: 60000                   # per year (jobs with no listed salary still pass)
  # Your strongest area: listings touching these rank higher
  focusSkills: [node, express, nestjs, typescript]
  experience:
    years: 4                     # professional experience
    allowSenior: true            # keep "Senior ..." titles (Staff/Principal/Lead/Architect are always dropped)
    maxYearsRequired: 5          # drop jobs asking for more than this many years
  # Fed to the AI fit check. Fill in real projects/results for sharper verdicts.
  portfolio:
    strongest: "Backend (Node.js, Express, NestJS, TypeScript)"
    summary: "Backend-first full-stack TypeScript developer. Has built with Solana but only at working level, not expert: Solana-core, protocol, Anchor-heavy or security-audit roles should be 'stretch' at best; general web3 dApp/backend/frontend work is fine."
    # (add what you build and for whom here)
    projects: []                 # e.g. "Payments API on NestJS + Postgres, 20k users"
    achievements: []             # e.g. "2nd place Solana hackathon 2025"
  # Titles containing these are dropped (content/social bounties etc.)
  excludeKeywords: [twitter, tweet, thread, "x post", video, meme, translate, ambassador, "content creat", "write a post", "create content", "create x", "social quest"]
digest:
  maxResults: 30                 # long digests are split across several Telegram messages
  minScore: 0.35
  maxPerType: { job: 20, freelance: 6, hackathon: 5, bounty: 5, grant: 8, other: 2 }
  sendWhenEmpty: false           # runs every 3h; stay quiet if nothing new
ai:
  enabled: true                  # needs GROQ_API_KEY and/or OPENROUTER_API_KEY (Groq first, OpenRouter fallback)
  mode: label                    # label = tag only | hide = drop "not a fit" | strict = keep only "qualified"
sources:
  remoteok: true
  weworkremotely: true
  devpost: true
  superteam: true
  remotive: true
  himalayas: true
  workingnomads: true
  jobicy: true
  hnhiring: true
  mastodon: true      # open stand-in for X (X has no free read API)
  superteamgrants: true   # rolling Superteam grants (chapter grants limited to Nigeria + global)
  devfolio: true          # online hackathons
  evergreen: true         # monthly reminder of standing grant programmes (Solana Fdn, EF ESP, W3F, ...)
  cantina: true           # live security bounties touching Rust/Solana only
  reddit: true        # r/forhire [Hiring]; may be blocked from CI IPs
